# XcodeGen manifest — the .xcodeproj is generated, never committed.
#
# This project is authored on Windows, where Xcode does not exist. Keeping the
# project definition as plain YAML means the whole repo is editable here and
# the only machine that ever needs Xcode is the CI runner, which regenerates
# the project from this file before every build.
name: BoxAndFound
options:
  bundleIdPrefix: net.boxandfound
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6 strict concurrency is off for now: supabase-swift 2.x is not
    # fully Sendable-audited, and turning it on before the first green build
    # would mix language-mode errors in with real ones.
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  BoxAndFound:
    type: application
    platform: iOS
    sources:
      - path: Sources/BoxAndFound
      - path: Resources
        optional: true
    dependencies:
      - package: Supabase
        product: Supabase
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.boxandfound.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"       # iPhone only, as the web client is portrait-only
        CODE_SIGNING_ALLOWED: NO          # CI builds for the simulator; signing arrives with TestFlight
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    # Generated alongside the Info.plist rather than committed, for the same
    # reason. Sign in with Apple does not work without it on a signed build,
    # and offering Google or Facebook without Apple fails App Store review.
    entitlements:
      path: Generated/BoxAndFound.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Box & Found
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Build settings from Secrets.xcconfig, surfaced so the app can read
        # them at runtime. Mirrors the Android BuildConfig fields.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        PremiumEmails: $(PREMIUM_EMAILS)
        StorageBucket: $(STORAGE_BUCKET)
        CFBundleURLTypes:
          - CFBundleURLName: net.boxandfound.ios
            CFBundleURLSchemes: [net.boxandfound.ios]

  BoxAndFoundTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/BoxAndFoundTests
    dependencies:
      - target: BoxAndFound
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # `@testable import BoxAndFound` links against the app binary, so the
        # bundle needs a host. Set explicitly rather than trusting XcodeGen to
        # infer it from the dependency — an inferred value that quietly stops
        # being inferred is a bad way to lose an afternoon.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BoxAndFound.app/BoxAndFound
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  BoxAndFound:
    build:
      targets:
        BoxAndFound: all
        BoxAndFoundTests: [test]
    test:
      config: Debug
      targets:
        - BoxAndFoundTests
    run:
      config: Debug
