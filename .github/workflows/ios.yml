# The compiler for this project.
#
# It is authored on Windows, so nothing here is ever built locally: this
# workflow is the only thing that sees Xcode. Keep it fast and keep its output
# readable — it is the feedback loop, not a release gate.
name: iOS

on:
  push:
    branches: [main, development]
    # macOS minutes bill at 10x, so a README edit does not get to spend three
    # of them proving the Swift still compiles.
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Record the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Real credentials when the repository has them, placeholders otherwise.
      # Actions withholds secrets from pull requests raised on forks, so those
      # runs get the stand-ins and `LiveBackendTests` switches itself off —
      # a fork still gets a green run without ever seeing a secret.
      #
      # The placeholders have to be *shaped* like credentials even though they
      # never dial out: the test bundle is hosted inside the app, so running
      # tests launches BoxAndFoundApp for real, and AppConfig rejecting the
      # .example file's obvious dummies would trap on launch before a single
      # test ran. That mistake cost run 34458632558.
      #
      # The URL is split around $(SLASH) because xcconfig treats // as a
      # comment, mid-value included — written literally it becomes "https:".
      - name: Write Secrets.xcconfig
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          url="${SUPABASE_URL:-https://ci-placeholder.supabase.co}"
          key="${SUPABASE_ANON_KEY:-ci-placeholder-anon-key}"
          host="${url#https://}"
          {
            printf 'SLASH = /\n'
            printf 'SUPABASE_URL = https:$(SLASH)$(SLASH)%s\n' "$host"
            printf 'SUPABASE_ANON_KEY = %s\n' "$key"
            printf 'STORAGE_BUCKET = box-images\n'
            printf 'SITE_URL = https:$(SLASH)$(SLASH)boxandfound.net\n'
            printf 'PREMIUM_EMAILS =\n'
          } > Config/Secrets.xcconfig
          if [ -n "$SUPABASE_URL" ]; then
            echo "Live backend configured; LiveBackendTests will run."
          else
            echo "No credentials available; LiveBackendTests will be skipped."
          fi

      - name: Cache resolved packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No iPhone simulator on this runner image:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Booted here rather than by xcodebuild, because a recording and a status
      # bar both need a device that already exists. xcodebuild reuses whatever
      # is booted for the destination it was given.
      - name: Boot the simulator
        run: |
          udid="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # 9:41, full battery, full signal — the clock and the battery are the
          # only things on screen that change between runs, and a screenshot
          # worth comparing to last week's cannot have them drifting.
          xcrun simctl status_bar "$udid" override \
            --time "9:41" \
            --batteryState charged \
            --batteryLevel 100 \
            --cellularBars 4 \
            --wifiBars 3 || true
          xcrun simctl ui "$udid" appearance light || true

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project BoxAndFound.xcodeproj \
            -scheme BoxAndFound \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      # The video is the only way anyone on this project sees the app move:
      # transitions, spinners, keyboard behaviour and the order things appear
      # in are all invisible to a screenshot and to an assertion.
      - name: Test, with a recording
        run: |
          udid="${{ steps.sim.outputs.udid }}"
          # h264 rather than the default hevc, so the file plays on Windows
          # without hunting for a codec.
          xcrun simctl io "$udid" recordVideo --codec h264 --force test-run.mp4 &
          recorder=$!

          status=0
          set -o pipefail
          xcodebuild test-without-building \
            -project BoxAndFound.xcodeproj \
            -scheme BoxAndFound \
            -destination "id=$udid" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            | tee test.log || status=$?

          # SIGINT, not a kill: recordVideo writes the index that makes the
          # file playable only when it is asked to stop politely. Waiting for
          # it to exit is what lets the upload step find a finished file.
          kill -INT "$recorder" 2>/dev/null || true
          wait "$recorder" 2>/dev/null || true

          exit $status

      # Dark mode is where a hardcoded colour shows up, and only the tour is
      # rerun — the behaviour suites have nothing to say about appearance, and
      # macOS minutes bill at 10x.
      - name: Photograph the app in dark mode
        if: always()
        run: |
          udid="${{ steps.sim.outputs.udid }}"
          xcrun simctl ui "$udid" appearance dark
          set -o pipefail
          xcodebuild test-without-building \
            -project BoxAndFound.xcodeproj \
            -scheme BoxAndFound \
            -destination "id=$udid" \
            -derivedDataPath build \
            -only-testing:BoxAndFoundUITests/ScreenshotTourTests \
            -resultBundlePath TestResultsDark.xcresult \
            | tee dark.log

      # Attachments come out of the bundle named by UUID, with a manifest
      # holding the names the tests gave them. Renaming is best-effort: a
      # schema change should cost readable filenames, not the gallery.
      - name: Extract the screenshots
        if: always()
        run: |
          extract() {
            bundle="$1"
            into="$2"
            [ -d "$bundle" ] || return 0
            mkdir -p "$into"
            if ! xcrun xcresulttool export attachments \
                   --path "$bundle" --output-path "$into" >/dev/null 2>&1; then
              echo "::warning::Could not export attachments from $bundle"
              xcrun xcresulttool export attachments --help || true
              return 0
            fi
            if [ -f "$into/manifest.json" ]; then
              jq -r '.. | objects
                     | select(.exportedFileName and .suggestedHumanReadableName)
                     | [.exportedFileName, .suggestedHumanReadableName] | @tsv' \
                "$into/manifest.json" 2>/dev/null \
              | while IFS="$(printf '\t')" read -r from to; do
                  case "$to" in *.*) ;; *) to="$to.png" ;; esac
                  if [ -f "$into/$from" ]; then mv -f "$into/$from" "$into/$to"; fi
                done
            fi
          }

          mkdir -p gallery
          extract TestResults.xcresult gallery/light
          extract TestResultsDark.xcresult gallery/dark
          if [ -f test-run.mp4 ]; then mv test-run.mp4 gallery/; fi

          echo '## The app, as of this commit' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the `app-screenshots` artifact below.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          find gallery -type f | sort | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: gallery
          if-no-files-found: warn
          retention-days: 14

      - name: Summarise failures
        if: failure()
        run: |
          echo '## Compiler and test output' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -hE "error:|failed" build.log test.log dark.log 2>/dev/null \
            | head -100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
