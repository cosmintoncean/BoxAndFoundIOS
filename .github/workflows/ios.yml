# The compiler for this project.
#
# It is authored on Windows, so nothing here is ever built locally: this
# workflow is the only thing that sees Xcode. Keep it fast and keep its output
# readable — it is the feedback loop, not a release gate.
name: iOS

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Record the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Unit tests never reach the network, so CI builds against placeholders
      # rather than real credentials. When TestFlight arrives, the release job
      # gets the real values from repository secrets — and will need the same
      # SLASH dance, because xcconfig treats // as a comment.
      #
      # These have to be *shaped* like real credentials even though nothing
      # dials out: the test bundle is hosted inside the app, so running tests
      # launches BoxAndFoundApp for real, and AppConfig rejecting the example
      # file's obvious dummies would trap on launch before a single test ran.
      # Copying the .example file here is exactly the mistake that cost run
      # 34458632558.
      - name: Write a placeholder Secrets.xcconfig
        run: |
          cat > Config/Secrets.xcconfig <<'CFG'
          SLASH = /
          SUPABASE_URL = https:$(SLASH)$(SLASH)ci-placeholder.supabase.co
          SUPABASE_ANON_KEY = ci-placeholder-anon-key
          PREMIUM_EMAILS =
          CFG

      - name: Cache resolved packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No iPhone simulator on this runner image:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project BoxAndFound.xcodeproj \
            -scheme BoxAndFound \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Summarise failures
        if: failure()
        run: |
          echo '## Compiler output' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|warning:|failed" build.log | head -100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
