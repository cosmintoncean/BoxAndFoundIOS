# The compiler for this project.
#
# It is authored on Windows, so nothing here is ever built locally: this
# workflow is the only thing that sees Xcode. Keep it fast and keep its output
# readable — it is the feedback loop, not a release gate.
name: iOS

on:
  push:
    branches: [main, development]
    # macOS minutes bill at 10x, so a README edit does not get to spend three
    # of them proving the Swift still compiles.
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Record the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Real credentials when the repository has them, placeholders otherwise.
      # Actions withholds secrets from pull requests raised on forks, so those
      # runs get the stand-ins and `LiveBackendTests` switches itself off —
      # a fork still gets a green run without ever seeing a secret.
      #
      # The placeholders have to be *shaped* like credentials even though they
      # never dial out: the test bundle is hosted inside the app, so running
      # tests launches BoxAndFoundApp for real, and AppConfig rejecting the
      # .example file's obvious dummies would trap on launch before a single
      # test ran. That mistake cost run 34458632558.
      #
      # The URL is split around $(SLASH) because xcconfig treats // as a
      # comment, mid-value included — written literally it becomes "https:".
      - name: Write Secrets.xcconfig
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          url="${SUPABASE_URL:-https://ci-placeholder.supabase.co}"
          key="${SUPABASE_ANON_KEY:-ci-placeholder-anon-key}"
          host="${url#https://}"
          {
            printf 'SLASH = /\n'
            printf 'SUPABASE_URL = https:$(SLASH)$(SLASH)%s\n' "$host"
            printf 'SUPABASE_ANON_KEY = %s\n' "$key"
            printf 'PREMIUM_EMAILS =\n'
          } > Config/Secrets.xcconfig
          if [ -n "$SUPABASE_URL" ]; then
            echo "Live backend configured; LiveBackendTests will run."
          else
            echo "No credentials available; LiveBackendTests will be skipped."
          fi

      - name: Cache resolved packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No iPhone simulator on this runner image:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project BoxAndFound.xcodeproj \
            -scheme BoxAndFound \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Summarise failures
        if: failure()
        run: |
          echo '## Compiler output' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|warning:|failed" build.log | head -100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
